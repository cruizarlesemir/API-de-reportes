spring.application.name=reporteservice

# Render (y otros PaaS) inyectan el puerto en la variable PORT.
server.port=${PORT:8080}

# Base de datos MySQL. Puedes sobreescribir estos valores con variables de entorno:
# DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reportesdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Nota: en Spring Boot 4 (Jackson 3) las fechas java.time se serializan en
# ISO-8601 por defecto; la propiedad spring.jackson.serialization.write-dates-as-timestamps
# ya no existe y provoca un error al arrancar.
